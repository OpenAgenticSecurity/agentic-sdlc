name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Runs the same deterministic suite as CI on the tagged revision, attests SLSA
# build provenance for the release archive, and publishes the tarball plus
# SHA-256 checksums. A manual dispatch only verifies and packages.
jobs:
  verify-and-release:
    name: verify-and-release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out tagged revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install hash-locked test dependencies
        run: "python -m pip install --require-hashes --only-binary=:all: -r requirements-test.txt"

      - name: Run full deterministic verification suite
        run: make verify-all

      - name: Package source archive and checksums
        run: |
          set -euo pipefail
          mkdir -p dist
          git archive --format=tar.gz --prefix="agentic-sdlc-${GITHUB_REF_NAME}/" HEAD > "dist/agentic-sdlc-${GITHUB_REF_NAME}.tar.gz"
          (cd dist && sha256sum -- *.tar.gz > SHA256SUMS.txt)

      - name: Attest build provenance (SLSA)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/agentic-sdlc-*.tar.gz"

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          generate_release_notes: true
          files: dist/*
