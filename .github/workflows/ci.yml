name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Executed from PR-controlled sources; candidate/advisory only.
# This workflow is not self-attesting and does not establish required status,
# trusted execution, CODEOWNER approval, independent mechanism review, or
# admin-bypass controls.
jobs:
  # Stable job name: use `verify-agentic-sdlc` as the required status context.
  verify-agentic-sdlc:
    name: verify-agentic-sdlc
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact candidate revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Assert exact candidate revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          printf 'candidate_head=%s\n' "$actual_sha"
          test "$actual_sha" = "$EXPECTED_SHA"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install hash-locked test dependencies
        run: "python -m pip install --require-hashes --only-binary=:all: -r requirements-test.txt"

      - name: Run full deterministic verification suite
        run: make verify-all

  # The scripts are meant to be copied onto adopters' machines, so the same
  # suite also runs on macOS (BSD userland) and on a newer Python.
  portability:
    name: portability (${{ matrix.os }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: "3.13"
          - os: macos-15
            python: "3.11"
    steps:
      - name: Check out exact candidate revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install hash-locked test dependencies
        run: "python -m pip install --require-hashes --only-binary=:all: -r requirements-test.txt"

      - name: Run full deterministic verification suite
        run: make verify-all

  # ShellCheck for scripts/*.sh and actionlint for every shipped workflow,
  # including the L1 templates adopters copy. Both run from digest-pinned images.
  static-analysis:
    name: static-analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact candidate revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Run ShellCheck and actionlint
        run: make static-analysis
