  - name: Getting started and maturity boundaries
    url: https://github.com/OpenAgenticSecurity/agentic-sdlc/blob/main/BOOTSTRAP.md
    about: Read BOOTSTRAP.md and MATURITY.md before opening an issue about adoption.
