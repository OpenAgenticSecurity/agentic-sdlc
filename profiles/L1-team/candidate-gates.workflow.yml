name: Candidate Gates

on:
  pull_request:
    branches: [main] # Replace `main` if your default branch differs.
  # If using GitHub Merge Queue, also enable `merge_group:` and resolve
  # `github.event.merge_group.head_sha || github.event.pull_request.head.sha || github.sha`.

permissions:
  contents: read

concurrency:
  group: candidate-gates-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Candidate workflow executed from PR-controlled source.
# Advisory only; not self-attesting and not trusted enforcement.
jobs:
  agent-check:
    name: agent-check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Assert exact candidate revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      # Add your SHA-pinned language runtime setup & dependency install here
      # (e.g. actions/setup-python, actions/setup-node, dtolnay/rust-toolchain).

      - name: Run local-equivalent agent check
        run: make agent-check
