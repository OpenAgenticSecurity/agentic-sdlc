name: Python Fail-Closed Candidate Gates

on:
  pull_request:
    branches: [main] # Replace `main` if your default branch differs (e.g. `master`).
  # If using GitHub Merge Queue, also enable `merge_group:` and resolve
  # `github.event.merge_group.head_sha || github.event.pull_request.head.sha || github.sha`.

permissions:
  contents: read

concurrency:
  group: py-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Candidate/advisory workflow executed from PR-controlled source.
# Not self-attesting; mark this job required in GitHub Branch Rulesets.
jobs:
  agent-check:
    name: agent-check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Assert exact candidate revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install locked dependencies (fail closed on missing or unpinned lockfile)
        run: |
          set -euo pipefail
          req_file=""
          for candidate in requirements.lock requirements-dev.lock requirements-dev.txt requirements.txt; do
            if [ -f "$candidate" ]; then
              req_file="$candidate"
              break
            fi
          done
          if [ -n "$req_file" ]; then
            if grep -q -- '--hash=sha256:' "$req_file"; then
              python -m pip install --require-hashes --only-binary=:all: -r "$req_file"
            else
              # Reject floating or unpinned package lines (every package line must pin exact `==`)
              bad_lines="$(grep -Ev '^[[:space:]]*(#|$|-r[[:space:]]|-c[[:space:]]|--)' "$req_file" | grep -Ev '==' || true)"
              if [ -n "$bad_lines" ]; then
                echo "CI fail-closed: unpinned dependency specifier(s) in $req_file (pin exact == versions or --require-hashes):" >&2
                printf '%s\n' "$bad_lines" >&2
                exit 2
              fi
              python -m pip install -r "$req_file"
            fi
          elif [ -f uv.lock ] && command -v uv >/dev/null 2>&1; then
            uv sync --locked --frozen
          else
            echo "CI not configured: commit a pinned/hash-locked requirements file (or uv.lock)." >&2
            exit 2
          fi

      # Baseline: syntax errors, pyflakes, bugbear, bandit (S) and async rules.
      # `assert` (S101) is allowed only in test files because pytest relies on it.
      # Tune further in [tool.ruff.lint] of pyproject.toml; S603/S607 flag every
      # subprocess call and need a per-call review before you ignore them.
      - name: Security & correctness lint (Ruff F + B + S + ASYNC rules)
        run: |
          set -euo pipefail
          git diff --check
          ruff check --select E9,F,B,S,ASYNC --extend-per-file-ignores 'tests/**:S101' --extend-per-file-ignores '**/test_*.py:S101' .

      - name: Run pytest (fail closed on exit code 5 / 0 tests collected)
        run: |
          set -euo pipefail
          pytest -q

      # Optional: if using `deps` as local/CI engineering carrier:
      # - name: Architecture, lineage & security audit (deps)
      #   run: deps security-audit . && deps agent-verify . --receipt .deps/receipt.json
